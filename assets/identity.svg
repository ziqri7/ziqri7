  <style>
    text { font-family: 'Cascadia Code', Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .value { fill: #d4d4d4; font-weight: 600; }
    .label { fill: #999e9b; }
    .green { fill: #5ebd86; }
    .line { animation: reveal 700ms ease-out backwards; }
    .l2 { animation-delay: 140ms; } .l3 { animation-delay: 280ms; }
    .l4 { animation-delay: 420ms; } .l5 { animation-delay: 560ms; }
    .l6 { animation-delay: 700ms; }
    @keyframes reveal { from { transform: translateY(3px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
