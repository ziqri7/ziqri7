<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
  <title id="title">Ziqri — Web App &amp; Automation Builder</title>
  <desc id="desc">Moch Syafaat Ziqri, based in Bontang, Indonesia. Business tools, digital products and GovTech. AI-assisted development.</desc>
  <style>
    text { font-family: 'Cascadia Code', Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .value { fill: #d4d4d4; font-weight: 600; }
    .label { fill: #999e9b; font-size: 14px; }
    .green { fill: #5ebd86; }
    .command { clip-path: inset(0); animation: type 900ms steps(21, end) 150ms backwards; }
    .typing-cursor { fill: #5ebd86; opacity: 0; animation: typing-cursor 1050ms steps(21, end) forwards; }
    .line { animation: reveal 280ms cubic-bezier(0.16, 1, 0.3, 1) 1050ms backwards; }
    .l2 { animation-delay: 1210ms; } .l3 { animation-delay: 1370ms; }
    .l4 { animation-delay: 1530ms; } .l5 { animation-delay: 1690ms; }
    .l6 { animation-delay: 1950ms; }
    .cursor { animation: blink 650ms steps(1, end) 1950ms 4 backwards; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
    @keyframes typing-cursor {
      0%, 14% { opacity: 1; transform: translateX(0); }
      99% { opacity: 1; transform: translateX(214px); }
      100% { opacity: 0; transform: translateX(214px); }
    }
    @keyframes blink { 0%, 50% { opacity: 0; } 51%, 100% { opacity: 1; } }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .line, .command, .typing-cursor, .cursor { animation: none; }
      .typing-cursor { opacity: 0; }
    }
  </style>
  <rect width="400" height="500" rx="14" fill="#0b0d0c"/>
  <circle cx="24" cy="25" r="5" fill="#ad5554"/><circle cx="43" cy="25" r="5" fill="#a98b3a"/><circle cx="62" cy="25" r="5" fill="#438552"/>
  <text x="376" y="29" text-anchor="end" class="label" style="font-size:12px">~/ziqri7</text>
  <text x="24" y="78" class="command"><tspan class="green">$</tspan><tspan class="value"> ./identity --reveal</tspan></text>
  <rect class="typing-cursor" x="24" y="63" width="9" height="18"/>
  <g class="line"><text x="24" y="122" class="label">name</text><text x="24" y="148" class="value">Moch Syafaat Ziqri</text></g>
  <g class="line l2"><text x="24" y="184" class="label">role</text><text x="24" y="210" class="value">Web App &amp; Automation Builder</text></g>
  <g class="line l3"><text x="24" y="246" class="label">focus</text><text x="24" y="272" class="value">Business Tools · Digital Products</text><text x="24" y="296" class="value">GovTech</text></g>
  <g class="line l4"><text x="24" y="332" class="label">location</text><text x="24" y="358" class="value">Bontang, Indonesia</text></g>
  <g class="line l5"><text x="24" y="394" class="label">approach</text><text x="24" y="420" class="value">AI-assisted development</text></g>
  <text x="24" y="473" class="line l6"><tspan class="green">$</tspan><tspan class="value"> ready</tspan><tspan class="green cursor"> _</tspan></text>
</svg>
